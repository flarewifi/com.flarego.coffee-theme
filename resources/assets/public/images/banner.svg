<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Fresh coffee and free WiFi banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f4e37"/>
      <stop offset="1" stop-color="#3f2a1d"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ead9"/>
      <stop offset="1" stop-color="#d8c4a3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg)"/>
  <!-- scattered beans -->
  <g fill="#4a3324" opacity="0.5">
    <g transform="translate(120 250) rotate(25)"><ellipse rx="14" ry="9"/><path d="M-14 0h28" stroke="#2f2118" stroke-width="2"/></g>
    <g transform="translate(690 70) rotate(-15)"><ellipse rx="13" ry="8"/><path d="M-13 0h26" stroke="#2f2118" stroke-width="2"/></g>
    <g transform="translate(640 240) rotate(40)"><ellipse rx="12" ry="8"/><path d="M-12 0h24" stroke="#2f2118" stroke-width="2"/></g>
    <g transform="translate(80 90) rotate(-30)"><ellipse rx="12" ry="7"/><path d="M-12 0h24" stroke="#2f2118" stroke-width="2"/></g>
  </g>
  <!-- steam + wifi -->
  <g fill="none" stroke="#cdb891" stroke-linecap="round" opacity="0.95">
    <path d="M250 120a44 44 0 0 1 60 0" stroke-width="7"/>
    <path d="M264 138a25 25 0 0 1 32 0" stroke-width="7"/>
    <circle cx="280" cy="154" r="5" fill="#cdb891" stroke="none"/>
  </g>
  <!-- cup -->
  <ellipse cx="280" cy="245" rx="70" ry="12" fill="#2a1c13"/>
  <path d="M228 168h104v18a40 40 0 0 1-40 40h-24a40 40 0 0 1-40-40z" fill="url(#cup)"/>
  <path d="M332 176h12a20 20 0 0 1 0 40h-12" fill="none" stroke="#f3ead9" stroke-width="10"/>
  <ellipse cx="280" cy="168" rx="52" ry="10" fill="#3f2a1d"/>
  <!-- text -->
  <text x="430" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#f3ead9">Fresh Coffee</text>
  <text x="430" y="196" font-family="system-ui, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="3" fill="#cdb891">&amp; Free WiFi</text>
</svg>
